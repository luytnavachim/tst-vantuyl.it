name: Sync Hetzner from main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hetzner-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GitHub secrets ontbreken. Hetzner haalt main elke minuut zelf op."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Pull main on Hetzner
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: /usr/local/bin/sync-tst-vantuyl.sh
